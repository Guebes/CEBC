<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container">
        <h2>Cadastro</h2>
        <form>
            <label class="form-label" for="#camp_nome">Nome</label>
            <input class="form-control" type="text" id="camp_nome">
            <label class="form-label" for="#camp_email">E-mail</label>
            <input class="form-control" type="email" id="camp_email">
            <label class="form-label" for="#camp_tel">Telefone</label>
            <input class="form-control" type="number" id="camp_tel">
            <div class="btn btn-success">Enviar</div>
        </form>
    </div>
</body>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script> <!-- Carregue o jQuery primeiro -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
<script src="./main.js"></script>
</html>
